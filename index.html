<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a">
<title>Hol vagyok? – Magyarország</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="app">
<header><div><div class="eyebrow">MAGYARORSZÁG • VAK TÉRKÉP</div><h1>Hol vagyok?</h1></div><div class="scorebox"><span>Pont</span><strong id="score">0</strong></div></header>
<section class="card">
<div class="question-row"><div><span class="muted">Keresd meg a térképen:</span><h2 id="city-name">Betöltés…</h2></div><div class="attempts"><span class="muted">Próbálkozás</span><strong><span id="attempt">1</span> / 3</strong></div></div>
<div class="map-toolbar"><div class="map-modes" role="group" aria-label="Térképmód"><button id="normal-mode" class="mode active" type="button">🗺️ Térkép</button><button id="relief-mode" class="mode" type="button">⛰️ Domborzat</button></div><div id="direction-box" class="direction-box" aria-live="polite"><span class="dir-arrow">—</span><span class="dir-text">Tippelj a térképen</span></div></div>
<div class="map-wrap"><div id="map" class="map" role="img" aria-label="Magyarország vak térképe"><img id="normal-map" class="map-image normal" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Hungary_map_blank.svg" alt="Magyarország vak térképe folyókkal és tavakkal"><img id="relief-map" class="map-image relief" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Reliefkarte_Ungarn.png" alt="Magyarország domborzati térképe"><div id="guess-layer"></div><div id="map-pan-layer"></div><button id="map-click" class="map-click" type="button" aria-label="Tipp helyének kiválasztása"></button><div class="zoom-controls" aria-label="Térkép nagyítása"><button id="zoom-out" type="button" aria-label="Kicsinyítés">−</button><span id="zoom-level">100%</span><button id="zoom-in" type="button" aria-label="Nagyítás">+</button><button id="zoom-reset" type="button" aria-label="Nézet visszaállítása">↺</button></div></div><div class="map-hint">Kattints a térképre • nagyításhoz használd a + / − gombokat</div></div>
<div id="result" class="result" aria-live="polite"></div>
<div class="controls"><button id="new-game" class="secondary" type="button">Új játék</button><button id="next" class="primary" type="button" disabled>Következő város</button></div>
</section><footer>3 próbálkozás • 20 km-es találati határ • 20 magyar város</footer>
</main><script src="script.js"></script></body></html>
