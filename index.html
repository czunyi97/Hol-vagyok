<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f3">
<title>Hol vagyok? – Magyarország</title>
<link rel="stylesheet" href="style-v2.css">
</head>
<body>
<main class="app">
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">🗺️</div>
      <div class="brand-copy">
        <div class="eyebrow">MAGYARORSZÁG • VAK TÉRKÉP</div>
        <h1>Hol vagyok?</h1>
      </div>
    </div>
    <div class="header-actions">
      <div class="score-pill"><span>Pont</span><strong id="score">0</strong></div>
      <div class="attempts"><span>Próbálkozás</span><strong><span id="attempt">1</span><b>/ 3</b></strong></div>
      <button id="new-game" class="new-game" type="button">↻ <span>Új játék</span></button>
    </div>
  </header>

  <section class="game">
    <div class="map-shell">
      <div class="map-toolbar">
        <div class="map-modes" role="group" aria-label="Térkép nézet">
          <button id="normal-mode" class="mode active" type="button">🗺️ Térkép</button>
          <button id="relief-mode" class="mode" type="button">⛰️ Domborzat</button>
        </div>
      </div>

      <div class="map-info">
        <span class="info-label">KERESD MEG A TÉRKÉPEN</span>
        <h2 id="city-name">Betöltés…</h2>
        <div id="direction-box" class="direction-box" aria-live="polite">
          <span class="dir-arrow">—</span>
          <span class="dir-text">Tippelj a térképen</span>
        </div>
      </div>

      <div class="zoom-controls" aria-label="Térkép nagyítása">
        <button id="zoom-in" type="button" aria-label="Nagyítás">+</button>
        <button id="zoom-out" type="button" aria-label="Kicsinyítés">−</button>
      </div>

      <div class="map-wrap">
        <div id="map" class="map">
          <div id="map-content" class="map-content">
            <img id="normal-map" class="map-image normal" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Hungary_map_blank.svg" alt="Magyarország vak térképe folyókkal és nagy tavakkal">
            <img id="relief-map" class="map-image relief" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Reliefkarte_Ungarn.png" alt="Magyarország domborzati térképe">
            <div id="guess-layer"></div>
          </div>
          <button id="map-click" class="map-click" type="button" aria-label="Tipp helyének kiválasztása"></button>
          <div class="map-hint">Kattints a térképre • nagyításhoz görgess vagy húzd</div>
        </div>
      </div>

      <div class="result-row">
        <div id="result" class="result" aria-live="polite"></div>
        <button id="next" class="next-button" type="button" disabled>Következő város →</button>
      </div>
    </div>
  </section>
</main>
<button id="zoom-reset" hidden type="button">100%</button>
<script src="script.js"></script>
</body>
</html>
